apiVersion: v1
kind: ServiceAccount
metadata:
  name: polaris-controller
  namespace: polaris-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: polaris-controller
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - endpoints
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: polaris-controller-internal
  namespace: polaris-system
rules:
- apiGroups:
  - ""
  resources:
  - configmaps
  resourceNames:
  - polaris-client-config-tpl
  - plugin-default.properties
  - polaris-controller-sync-state-00
  - polaris-controller-sync-state-01
  - polaris-controller-sync-state-02
  - polaris-controller-sync-state-03
  - polaris-controller-sync-state-04
  - polaris-controller-sync-state-05
  - polaris-controller-sync-state-06
  - polaris-controller-sync-state-07
  - polaris-controller-sync-state-08
  - polaris-controller-sync-state-09
  - polaris-controller-sync-state-0a
  - polaris-controller-sync-state-0b
  - polaris-controller-sync-state-0c
  - polaris-controller-sync-state-0d
  - polaris-controller-sync-state-0e
  - polaris-controller-sync-state-0f
  verbs:
  - get
  - update
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
- apiGroups:
  - ""
  resources:
  - endpoints
  resourceNames:
  - polaris-controller
  verbs:
  - get
  - update
- apiGroups:
  - ""
  resources:
  - endpoints
  verbs:
  - create
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - leases
  resourceNames:
  - polaris-controller
  verbs:
  - get
  - update
- apiGroups:
  - "coordination.k8s.io"
  resources:
  - leases
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: polaris-controller-internal
  namespace: polaris-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: polaris-controller-internal
subjects:
  - kind: ServiceAccount
    name: polaris-controller
    namespace: polaris-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: polaris-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: polaris-controller
subjects:
  - kind: ServiceAccount
    name: polaris-controller
    namespace: polaris-system
