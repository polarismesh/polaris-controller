apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    {{- include "polaris-controller.controller.labels" . | nindent 4 }}
  name: {{ include "polaris-controller.controller.fullname" . }}
  namespace: polaris-system
spec:
  replicas: {{ .Values.controller.replicas }}
  revisionHistoryLimit: 10
  serviceName: polaris-controller
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      {{- include "polaris-controller.controller.selectorLabels" . | nindent 6 }}
  updateStrategy:
    rollingUpdate:
      partition: 0
  template:
    metadata:
      labels:
      {{- include "polaris-controller.controller.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: polaris-controller
          image: {{ template "polaris-controller.controller.image" . }}
          command: ["./polaris-controller"]
          args: ["--min-resync-period=60s",
                 "--leader-elect-namespace=polaris-system",
                 "--concurrency-polaris-size=100",
                 "--leader-elect=true"
          ]
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          startupProbe:
            tcpSocket:
              port: 9443
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 15
          readinessProbe:
            tcpSocket:
              port: 9443
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 9443
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            limits:
              cpu: {{ .Values.controller.limit.cpu }}
              memory: {{ .Values.controller.limit.memory }}
          volumeMounts:
            - mountPath: /polaris-controller/logs
              name: logs
              subPathExpr: $(POD_NAME)
            - name: certs
              mountPath: /etc/polaris-inject/certs
              readOnly: true
            - name: inject-config
              mountPath: /etc/polaris-inject/inject
              readOnly: true
            - name: config-volume
              mountPath: /etc/polaris-inject/config
              readOnly: true
      dnsPolicy: ClusterFirst
      restartPolicy: Always
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
      serviceAccountName: {{ include "polaris-controller.controller.fullname" . }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                  {{- include "polaris-controller.controller.selectorLabels" . | nindent 20 }}
      volumes:
        - name: certs
          secret:
            secretName: {{ include "polaris-controller.controller.fullname" . }}
        - name: inject-config
          configMap:
            name: {{ include "polaris-controller.controller.fullname" . }}-sidecar
            items:
              - key: mesh-config
                path: mesh-config
              - key: dns-config
                path: dns-config
              - key: java-agent-config
                path: java-agent-config
              - key: values
                path: values
        - name: config-volume
          configMap:
            name: {{ include "polaris-controller.controller.fullname" . }}-mesh
        - hostPath:
            path: /data/polaris-controller/logs
            type: "DirectoryOrCreate"
          name: logs
