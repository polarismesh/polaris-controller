apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "polaris-controller.controller.fullname" . }}
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - services
  - endpoints
  verbs:
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - list
  - watch
{{- if and .Values.polaris.sync.config.enable (or (eq .Values.polaris.sync.config.direction "both") (eq .Values.polaris.sync.config.direction "polarisToKubernetes")) }}
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
  - update
{{- if .Values.polaris.sync.config.allowDelete }}
  - delete
{{- end }}
{{- end }}
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create
  - patch
