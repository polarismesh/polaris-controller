apiVersion: v1
kind: Namespace
metadata:
  name: it-pc-ns-lifecycle
  annotations:
    polarismesh.cn/sync: "true"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ns-lifecycle-demo
  namespace: it-pc-ns-lifecycle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ns-lifecycle-demo
  template:
    metadata:
      labels:
        app: ns-lifecycle-demo
    spec:
      containers:
        - name: app
          image: ccr.ccs.tencentyun.com/evelyn_public/http-echo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: ns-lifecycle-demo
  namespace: it-pc-ns-lifecycle
  annotations:
    polarismesh.cn/sync: "true"
spec:
  selector:
    app: ns-lifecycle-demo
  ports:
    - name: http
      port: 8080
      targetPort: 8080
