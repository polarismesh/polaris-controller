# See https://golangci-lint.run/usage/configuration/
version: "2"
run:
  issues-exit-code: 2
  tests: false
linters:
  default: none
  enable:
    - errcheck
    - errchkjson
    - funlen
    - goconst
    - gocritic
    - govet
    - lll
    - misspell
    - nolintlint
    - revive
    - staticcheck
    - usestdlibvars
  settings:
    funlen:
      lines: 230
      statements: -1
    goconst:
      match-constant: false
      min-len: 2
      min-occurrences: 60
      numbers: true
      min: 5
      max: 20
      ignore-calls: false
    gocritic:
      disabled-checks:
        - ifElseChain
        - assignOp
        - appendAssign
        - singleCaseSwitch
        - regexpMust
        - typeSwitchVar
        - elseif
        - badCall
    govet:
      disable:
        - asmdecl
        - assign
        - atomic
        - atomicalign
        - bools
        - buildtag
        - cgocall
        - composites
        - copylocks
        - deepequalerrors
        - errorsas
        - fieldalignment
        - findcall
        - framepointer
        - httpresponse
        - ifaceassert
        - loopclosure
        - lostcancel
        - nilfunc
        - nilness
        - reflectvaluecompare
        - shift
        - shadow
        - sigchanyzer
        - sortslice
        - stdmethods
        - stringintconv
        - structtag
        - testinggoroutine
        - tests
        - unmarshal
        - unreachable
        - unsafeptr
        - unusedwrite
      enable-all: true
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
        unusedresult:
          funcs:
            - pkg.MyFunc
            - context.WithCancel
            - context.WithDeadline
            - context.WithTimeout
            - context.WithValue
            - sort.Reverse
          stringmethods:
            - MyMethod
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
      ignore-rules:
        - cancelled
    revive:
      severity: error
      rules:
        - name: atomic
        - name: line-length-limit
          arguments:
            - 480
          severity: error
        - name: unhandled-error
          arguments:
            - fmt.Printf
            - myFunction
          severity: warning
          disabled: true
        - name: var-naming
          arguments:
            - - ID
              - URL
              - IP
              - HTTP
              - JSON
              - API
              - UID
              - Id
              - Api
              - Uid
              - Http
              - Json
              - Ip
              - Url
            - - VM
          severity: warning
          disabled: true
        - name: string-format
          arguments:
            - - core.WriteError[1].Message
              - /^([^A-Z]|$)/
              - must not start with a capital letter
            - - fmt.Errorf[0]
              - /(^|[^\.!?])$/
              - must not end in punctuation
            - - panic
              - /^[^\n]*$/
              - must not contain line breaks
          severity: warning
          disabled: false
        - name: function-result-limit
          arguments:
            - 5
          severity: warning
          disabled: false
        - name: import-shadowing
          arguments:
            - github.com/polarismesh/polaris
            - namespace
          severity: warning
          disabled: false
        - name: waitgroup-by-value
          severity: warning
          disabled: false
        - name: max-public-structs
          arguments:
            - 35
          severity: warning
          disabled: false
        - name: indent-error-flow
          severity: warning
          disabled: false
        - name: function-length
          arguments:
            - 80
            - 0
          severity: warning
          disabled: false
        - name: file-header
          arguments:
            - Tencent is pleased to support the open source community by making Polaris available.
        - name: exported
          severity: warning
          disabled: true
        - name: errorf
          severity: warning
          disabled: false
        - name: error-naming
          severity: warning
          disabled: false
    staticcheck:
      checks:
        - all
        - -S1000
        - -S1001
        - -S1002
        - -S1008
        - -S1009
        - -S1016
        - -S1019
        - -S1023
        - -S1025
        - -S1029
        - -S1034
        - -S1040
        - -SA1004
        - -SA1006
        - -SA1016
        - -SA1019
        - -SA1029
        - -SA4006
        - -SA4009
        - -SA4010
        - -SA4015
        - -SA4017
        - -SA4021
        - -SA6002
        - -SA6003
        - -SA9003
        # stylecheck(ST*) and quickfix(QF*) were not enabled before the v2 merge
        - -ST*
        - -QF*
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - revive
        path: _test\.go
        text: context.Context should be the first parameter of a function
      - linters:
          - revive
        path: _test\.go
        text: exported func.*returns unexported type.*which can be annoying to use
      - linters:
          - gocritic
        text: 'unnecessaryDefer:'
      - linters:
          - goconst
        path: (.+)_test\.go
    paths:
      - .*\.my\.go$
      - .*\.gen\.go$
      - .*\.pb\.go$
      - .*_test\.go$
      - .*\.yaml$
      - .*\.yml$
      - .*~
      - test
      - cmd/polaris-controller/app/options
      - cmd/polaris-controller/app
      - pkg/inject
      - pkg/util/configz
      - pkg/util/feature
      - pkg/util/flag
      - pkg/version
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/polarismesh/polaris-controller)
      custom-order: true
    gofmt:
      simplify: true
  exclusions:
    generated: lax
    paths:
      - .*\.my\.go$
      - .*\.gen\.go$
      - .*\.pb\.go$
      - .*_test\.go$
      - .*\.yaml$
      - .*\.yml$
      - .*~
      - test
      - cmd/polaris-controller/app/options
      - cmd/polaris-controller/app
      - pkg/inject
      - pkg/util/configz
      - pkg/util/feature
      - pkg/util/flag
      - pkg/version
      - third_party$
      - builtin$
      - examples$
